<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RateDost PK | Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-emerald-950 text-white p-5 shadow-lg">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black italic tracking-tighter">RATEDOST</h1>
                <p class="text-[10px] uppercase tracking-widest text-emerald-400 font-bold">Managed by Bilawal Khan Niazi</p>
            </div>
            <button onclick="toggleAdmin()" class="bg-amber-500 text-black px-4 py-1 rounded font-bold text-sm">ADMIN</button>
        </div>
    </header>

    <!-- Content -->
    <main class="max-w-2xl mx-auto p-6 w-full flex-grow">
        
        <!-- Public View -->
        <div id="public-view">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="font-bold text-gray-700 mb-4"><i class="fas fa-chart-line text-emerald-700 mr-2"></i> Current Market Rates</h2>
                <div class="space-y-3">
                    <div class="flex justify-between border-b pb-2"><span>Petrol</span><span class="font-bold">Rs 279.75</span></div>
                    <div class="flex justify-between border-b pb-2"><span>Gold</span><span class="font-bold">Rs 242,500</span></div>
                </div>
            </div>
        </div>

        <!-- Admin Secure View -->
        <div id="admin-view" class="hidden">
            <div class="bg-white p-8 rounded-2xl shadow-xl border border-emerald-100 text-center">
                <h3 class="font-bold text-lg text-emerald-950 mb-6">Owner Authentication</h3>
                <input type="password" id="secret-key" placeholder="Enter Secure Key" class="w-full border-2 border-gray-200 p-3 rounded-lg mb-4 text-center outline-none focus:border-emerald-600">
                <button onclick="authAdmin()" class="w-full bg-emerald-950 text-white py-3 rounded-lg font-black hover:bg-black transition">VALIDATE ACCESS</button>
            </div>
            
            <div id="dashboard" class="hidden mt-6 bg-emerald-50 p-6 rounded-2xl">
                <h2 class="font-black text-emerald-900 mb-4">Welcome, Bilawal Khan Niazi</h2>
                <p class="text-sm">Yahan se aap system ke rates control kar sakte hain.</p>
                <button onclick="location.reload()" class="mt-4 text-xs text-red-600 font-bold underline">Logout System</button>
            </div>
        </div>
    </main>

    <footer class="text-center py-6 text-[10px] text-gray-400">
        <p>© 2026 RateDost PK - Built for Precision.</p>
    </footer>

    <script>
        // Highly secured password logic
        const SECURE_KEY = "Khan123$$$M";

        function toggleAdmin() {
            document.getElementById('public-view').classList.add('hidden');
            document.getElementById('admin-view').classList.remove('hidden');
        }

        function authAdmin() {
            let input = document.getElementById('secret-key').value;
            if(input === SECURE_KEY) {
                document.getElementById('admin-view').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                alert("Access Granted: Bilawal Khan Niazi");
            } else {
                alert("ERROR: Security Breach Attempt Logged!");
            }
        }
    </script>
</body>
</html>
