/* ============================================================
   SAFE HELPERS
============================================================ */

function clone(obj){
    return JSON.parse(JSON.stringify(obj));
}

function esc(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function num(value){
    const n = Number(value);

    if(!Number.isFinite(n)){
        return "—";
    }

    return n.toLocaleString("en-PK",{
        maximumFractionDigits:2
    });
}

function formatDate(value){
    if(!value) return "—";

    try{
        const d = new Date(value);

        if(Number.isNaN(d.getTime())){
            return String(value);
        }

        return d.toLocaleDateString("en-PK",{
            day:"2-digit",
            month:"short",
            year:"numeric"
        });

    }catch{
        return String(value);
    }
}

function icon(category){

    const icons = {
        Food:"fa-solid fa-wheat-awn",
        Construction:"fa-solid fa-building",
        Fuel:"fa-solid fa-gas-pump",
        Agriculture:"fa-solid fa-tractor",
        Energy:"fa-solid fa-bolt",
        Transport:"fa-solid fa-truck",
        Medicines:"fa-solid fa-pills",
        Other:"fa-solid fa-box"
    };

    return icons[category] || icons.Other;
}

function showToast(message){

    const el = document.getElementById("toast");

    if(!el) return;

    el.textContent = message;
    el.classList.add("show");

    clearTimeout(window.__toastTimer);

    window.__toastTimer = setTimeout(()=>{
        el.classList.remove("show");
    },2500);
}
