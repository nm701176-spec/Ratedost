<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RateDost - Official & Market Rates</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    .navbar {
      background: #1e293b;
      padding: 0.8rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-links {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .nav-links button {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .nav-links button:hover, .nav-links button.active {
      background: #334155;
      color: #38bdf8;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .page { display: none; }
    .page.active { display: block; }
    h1, h2 {
      margin-bottom: 1.2rem;
      color: #f1f5f9;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 1.2rem;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #38bdf8;
    }
    .card h3 {
      font-size: 1.15rem;
      margin-bottom: 0.6rem;
      color: #f8fafc;
    }
    .rate-row {
      display: flex;
      justify-content: space-between;
      margin: 0.35rem 0;
      font-size: 0.95rem;
    }
    .label { color: #94a3b8; }
    .value { font-weight: 600; color: #e2e8f0; }
    .status {
      display: inline-block;
      margin-top: 0.6rem;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .up { background: #14532d; color: #4ade80; }
    .down { background: #7f1d1d; color: #f87171; }
    .same { background: #334155; color: #94a3b8; }
    .last-updated {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.5rem;
    }
    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }
    .cat-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 1rem;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
      text-align: center;
    }
    .cat-btn:hover, .cat-btn.active {
      background: #0ea5e9;
      border-color: #0ea5e9;
      color: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      padding: 0.9rem 1rem;
      text-align: left;
      border-bottom: 1px solid #334155;
    }
    th {
      background: #0f172a;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .diff-positive { color: #f87171; }
    .diff-negative { color: #4ade80; }
    .admin-form {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 14px;
      margin-bottom: 1.5rem;
      border: 1px solid #334155;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }
    input, select {
      width: 100%;
      padding: 0.7rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.95rem;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #0284c7; }
    .btn-danger {
      background: #dc2626;
    }
    .btn-danger:hover { background: #b91c1c; }
    .btn-sm {
      padding: 0.35rem 0.7rem;
      font-size: 0.85rem;
    }
    .calc-box {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 14px;
      max-width: 400px;
      border: 1px solid #334155;
    }
    .calc-box label {
      display: block;
      margin-bottom: 0.4rem;
      color: #94a3b8;
    }
    .calc-box input, .calc-box select {
      margin-bottom: 1rem;
    }
    .result {
      margin-top: 1rem;
      padding: 1rem;
      background: #0f172a;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: 600;
      color: #38bdf8;
    }
    .note {
      background: #1e3a5f;
      border-left: 4px solid #38bdf8;
      padding: 1rem;
      border-radius: 0 8px 8px 0;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: #bae6fd;
