<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RateDost PK - By Bilawal Khan Niazi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-emerald-950 text-white shadow-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showTab('rates')">
                <div class="bg-amber-400 text-emerald-950 font-bold px-3 py-1 rounded text-xl shadow">RD</div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">RateDost <span class="text-[10px] bg-red-600 px-1 rounded">PK</span></h1>
                    <p class="text-[10px] text-emerald-200">Official Price Hub | CEO: <span class="text-amber-300 font-bold">Bilawal Khan Niazi</span></p>
                </div>
            </div>
            <nav class="flex space-x-4 text-sm font-medium">
                <button onclick="showTab('rates')" class="hover:text-amber-400">Rates</button>
                <button onclick="showTab('admin')" class="text-amber-400 underline"><i class="fas fa-lock text-xs"></i> Admin</button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow">
        <!-- City Selector -->
        <div class="bg-white p-4 rounded-lg shadow border mb-6 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <i class="fas fa-map-marker-alt text-emerald-700"></i>
                <select id="city-selector" onchange="changeCity()" class="font-bold text-emerald-900 bg-emerald-50 p-2 rounded outline-none border border-emerald-600">
                    <option value="Lahore">Lahore</option><option value="Karachi">Karachi</option><option value="Islamabad">Islamabad</option><option value="Mianwali">Mianwali</option>
                </select>
            </div>
            <div class="text-[11px] text-emerald-800 font-bold">Project Managed By: Bilawal Khan Niazi</div>
        </div>

        <!-- Tab 1: Rates -->
        <div id="rates-tab" class="space-y-6">
            <h2 class="text-2xl font-bold text-gray-800"><span id="selected-city-title">Lahore</span> Live Market Rates</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="rates-cards"></div>

            <!-- Comment Section -->
            <div class="bg-white p-6 rounded-xl shadow border mt-10">
                <h3 class="font-bold text-emerald-900 mb-4"><i class="fas fa-comments mr-2"></i> Public Rate Reporting</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                    <input type="text" id="user-name" placeholder="Name" class="border p-2 rounded text-sm w-full">
                    <input type="text" id="user-item" placeholder="Item Name" class="border p-2 rounded text-sm w-full">
                    <input type="text" id="user-rate" placeholder="Rate (Rs)" class="border p-2 rounded text-sm w-full">
                </div>
                <button onclick="postComment()" class="bg-emerald-800 text-white px-6 py-2 rounded font-bold hover:bg-emerald-900">Post Report</button>
                <div id="comments-container" class="mt-6 space-y-3"></div>
            </div>
        </div>

        <!-- Tab 3: Admin -->
        <div id="admin-tab" class="hidden">
            <div id="admin-login-box" class="max-w-sm mx-auto bg-white p-8 rounded-xl shadow-xl text-center">
                <h3 class="font-bold text-xl mb-4">Admin Panel (Bilawal Khan Niazi)</h3>
                <input type="password" id="admin-pass-input" placeholder="Password" class="w-full border p-3 rounded mb-4 text-center">
                <button onclick="verifyAdmin()" class="w-full bg-emerald-950 text-white py-3 rounded font-bold">Unlock Access</button>
            </div>
            <div id="admin-dashboard" class="hidden bg-white p-6 rounded shadow border">
                <h2 class="font-bold text-emerald-900 mb-4">Update Official Rates</h2>
                <select id="edit-rate-select" class="w-full border p-2 mb-2"></select>
                <input type="number" id="edit-govt-price" placeholder="Govt Rate" class="w-full border p-2 mb-2">
                <input type="number" id="edit-market-price" placeholder="Market Rate" class="w-full border p-2 mb-4">
                <button onclick="saveRateChange()" class="w-full bg-emerald-800 text-white py-2 rounded">Save Changes</button>
                <button onclick="lockAdmin()" class="w-full mt-4 text-red-600 text-sm">Logout</button>
            </div>
        </div>
    </main>

    <footer class="bg-slate-950 text-white text-center py-6 mt-10">
        <p>© 2026 RateDost PK. All Rights Reserved.</p>
        <p class="text-[11px] text-amber-400">Owner & Developer: Bilawal Khan Niazi</p>
    </footer>

    <script>
        const SECRET_PASSCODE = "Khan123$$$";
        let currentCity = "Lahore";
        let ratesData = [
            { id: 1, name: "Petrol", category: "Fuel", govtRate: 279, marketRate: 279, unit: "Liter" },
            { id: 2, name: "Gold", category: "Gold", govtRate: 242000, marketRate: 242000, unit: "Tola" },
            { id: 3, name: "Cement", category: "Const", govtRate: 1350, marketRate: 1380, unit: "Bag" }
        ];

        function renderRates() {
            const container = document.getElementById('rates-cards');
            const select = document.getElementById('edit-rate-select');
            container.innerHTML = ''; select.innerHTML = '';
            ratesData.forEach(r => {
                container.innerHTML += `<div class="bg-white p-4 rounded shadow border">
                    <div class="font-bold text-lg">${r.name}</div>
                    <div class="text-sm">Govt: Rs ${r.govtRate} | Market: Rs ${r.marketRate}</div>
                </div>`;
                select.innerHTML += `<option value="${r.id}">${r.name}</option>`;
            });
        }

        function showTab(t) {
            document.getElementById('rates-tab').classList.add('hidden');
            document.getElementById('admin-tab').classList.add('hidden');
            document.getElementById(t + '-tab').classList.remove('hidden');
        }

        function verifyAdmin() {
            if(document.getElementById('admin-pass-input').value === SECRET_PASSCODE) {
                document.getElementById('admin-login-box').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
            } else alert('Wrong Password!');
        }

        function postComment() {
            const name = document.getElementById('user-name').value;
            const item = document.getElementById('user-item').value;
            const rate = document.getElementById('user-rate').value;
            document.getElementById('comments-container').innerHTML += `<div class="p-2 border rounded bg-emerald-50 text-xs"><b>${name}:</b> ${item} ka rate ${rate} hai.</div>`;
        }

        function lockAdmin() { location.reload(); }
        function changeCity() { document.getElementById('selected-city-title').innerText = document.getElementById('city-selector').value; }
        function saveRateChange() { alert('Rates Updated!'); renderRates(); }

        renderRates();
    </script>
</body>
    </html>
